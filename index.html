<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedRecon — Security Tools</title>
  <meta name="description" content="RedRecon — Self-hosted security research and reconnaissance tools.">
  <style>
    :root {
      --bg: #070708;
      --surface: #0d0d10;
      --card: #101014;
      --border: #28191c;
      --text: #f5f5f5;
      --muted: #918689;
      --accent: #ff3347;
      --accent-dark: #b51227;
      --danger: #ff1f3d;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(
          circle at 50% -10%,
          rgba(255, 35, 55, 0.14),
          transparent 38%
        ),
        #070708;
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Background Noise / Grid Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(255, 51, 71, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 51, 71, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: -1;
    }

    header {
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 7, 8, 0.75);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.15rem;
    }

    .brand span {
      color: var(--accent);
    }

    .nav-domain {
      font-size: 0.875rem;
      color: var(--muted);
      font-family: monospace;
      letter-spacing: -0.01em;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 2rem 5rem 2rem;
    }

    .hero {
      text-align: center;
      padding: 6rem 0 4rem 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1.5rem;
    }

    .hero h1 .recon-text {
      color: var(--text);
    }

    .hero h1 .research-text {
      color: var(--accent);
    }

    .hero h1 .build-text {
      color: var(--text);
    }

    .hero p {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      max-width: 540px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .tools-section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    .tools-section-title {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .tools-count {
      font-size: 0.875rem;
      color: var(--muted);
      font-family: monospace;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }

    .tool-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.75rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      overflow: hidden;
    }

    .tool-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent-dark);
      box-shadow: 0 10px 30px -10px rgba(255, 35, 55, 0.15);
    }

    .tool-card-content {
      display: flex;
      flex-direction: column;
    }

    .tool-icon {
      width: 42px;
      height: 42px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--accent);
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      font-family: monospace;
    }

    .tool-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.5rem;
    }

    .tool-description {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .tool-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(40, 25, 28, 0.5);
    }

    .tool-url {
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .tool-arrow {
      color: var(--muted);
      transition: transform 0.25s ease, color 0.25s ease;
      font-size: 1rem;
    }

    .tool-card:hover .tool-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 2rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-right {
      font-family: monospace;
    }

    /* Responsive Breakpoints */
    @media (max-width: 800px) {
      .tools-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .hero {
        padding: 4rem 0 3rem 0;
      }
    }

    @media (max-width: 550px) {
      .tools-grid {
        grid-template-columns: 1fr;
      }
      .nav-container, main, footer {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
      footer {
        flex-direction: column;
        gap: 0.75rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="https://redrecon.cfd" class="brand">RED<span>RECON</span></a>
      <div class="nav-domain">redrecon.cfd</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="status-badge">
        <span class="status-dot"></span>
        SELF-HOSTED SECURITY TOOLS
      </div>
      <h1>
        <span class="recon-text">Recon.</span><br>
        <span class="research-text">Research.</span><br>
        <span class="build-text">Build.</span>
      </h1>
      <p>
        A collection of self-hosted tools built for security research, reconnaissance, learning, and authorized testing.
      </p>
    </section>

    <section>
      <div class="tools-section-header">
        <h2 class="tools-section-title">Available Tools</h2>
        <span class="tools-count" id="toolsCount">0 tools</span>
      </div>
      <div class="tools-grid" id="toolsGrid">
        <!-- Dynamically generated tool cards will appear here -->
      </div>
    </section>
  </main>

  <footer>
    <div>&copy; 2026 RedRecon</div>
    <div class="footer-right">Built for security research &amp; authorized testing.</div>
  </footer>

  <script>
    const tools = [
      {
        name: "GTFOBins",
        url: "https://gtfobins.redrecon.cfd",
        description: "Self-hosted Unix binary reference for security research.",
        icon: "GB"
      },
      {
        name: "RevShell",
        url: "https://revshells.redrecon.cfd",
        description: "Self-hosted reverse shell reference and authorized lab utility.",
        icon: "RS"
      }
      {
        name: "RevShell",
        url: "https://autofilldanger.redrecon.cfd",
        description: "Self-hosted Autofill Phishing.",
        icon: "AD"
      {
    ];

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function extractHostname(urlString) {
      try {
        const parsed = new URL(urlString);
        return parsed.hostname;
      } catch (e) {
        return urlString.replace(/^https?:\/\//, "").replace(/\/$/, "");
      }
    }

    function renderPortal() {
      const grid = document.getElementById("toolsGrid");
      const countEl = document.getElementById("toolsCount");
      
      const count = tools.length;
      countEl.textContent = `${count} tool${count === 1 ? '' : 's'}`;

      if (count === 0) {
        grid.innerHTML = `<div class="empty-state">No tools configured at the moment.</div>`;
        return;
      }

      grid.innerHTML = tools.map(tool => {
        const safeName = escapeHTML(tool.name);
        const safeUrl = escapeHTML(tool.url);
        const safeDesc = escapeHTML(tool.description);
        const safeIcon = escapeHTML(tool.icon);
        const displayUrl = escapeHTML(extractHostname(tool.url));

        return `
          <a href="${safeUrl}" class="tool-card" target="_blank" rel="noopener noreferrer">
            <div class="tool-card-content">
              <div class="tool-icon">${safeIcon}</div>
              <h3 class="tool-title">${safeName}</h3>
              <p class="tool-description">${safeDesc}</p>
            </div>
            <div class="tool-footer">
              <span class="tool-url">${displayUrl}</span>
              <span class="tool-arrow">&rarr;</span>
            </div>
          </a>
        `;
      }).join("");
    }

    document.addEventListener("DOMContentLoaded", renderPortal);
  </script>
</body>
</html>
