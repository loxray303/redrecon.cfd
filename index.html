<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedRecon — Advanced Security Portal</title>
  <meta name="description" content="RedRecon — Self-hosted security research and reconnaissance tools.">
  
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Dynamic Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    :root {
      --bg: #050102; /* Extremely dark, slightly tinted red */
      --surface: rgba(20, 5, 8, 0.4);
      --glass-border: rgba(255, 31, 61, 0.15);
      --glass-hover: rgba(255, 31, 61, 0.6);
      --text: #ffffff;
      --muted: #a39598;
      --accent: #ff1f3d;
      --accent-glow: rgba(255, 31, 61, 0.5);
      --card-width: 380px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.6;
      /* Subtle vignette effect */
      box-shadow: inset 0 0 150px rgba(0,0,0,0.9);
    }

    /* ----------------------------------
       ANIME VIBE BACKGROUND (CANVAS)
    ----------------------------------- */
    #animeCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      pointer-events: none;
    }

    /* Center glowing aura */
    .center-aura {
      position: fixed;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vw;
      background: radial-gradient(circle, rgba(255, 31, 61, 0.08) 0%, transparent 60%);
      z-index: -1;
      pointer-events: none;
    }

    /* ----------------------------------
       HEADER
    ----------------------------------- */
    header {
      width: 100%;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(5, 1, 2, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }

    .brand span {
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent-glow);
    }

    .nav-domain {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--muted);
      background: rgba(255, 31, 61, 0.05);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
    }

    /* ----------------------------------
       HERO SECTION
    ----------------------------------- */
    main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 0 3rem 0;
    }

    .hero {
      text-align: center;
      padding: 0 2rem 3rem 2rem;
      animation: animePopIn 1s cubic-bezier(0.2, 1, 0.3, 1);
    }

    @keyframes animePopIn {
      0% { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.4rem 1.2rem;
      background: rgba(255, 31, 61, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
      box-shadow: 0 0 20px rgba(255, 31, 61, 0.1);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.6; box-shadow: 0 0 25px var(--accent); }
    }

    .hero h1 {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .hero h1 .research-text { 
      color: var(--accent); 
      text-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(255, 31, 61, 0.3);
      font-style: italic; /* Anime speedline vibe */
    }

    .hero p {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ----------------------------------
       SLIDER / MARQUEE (Right to Left)
    ----------------------------------- */
    .slider-section {
      width: 100%;
      padding: 2rem 0;
      position: relative;
      display: flex;
      overflow: hidden;
    }

    /* Edge Fade Gradients for seamless look */
    .slider-section::before,
    .slider-section::after {
      content: "";
      position: absolute;
      top: 0;
      width: 15vw;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }
    .slider-section::before {
      left: 0;
      background: linear-gradient(to right, var(--bg), transparent);
    }
    .slider-section::after {
      right: 0;
      background: linear-gradient(to left, var(--bg), transparent);
    }

    .marquee-track {
      display: flex;
      width: max-content;
      gap: 2rem;
      padding: 1rem 2rem;
      /* Marquee Animation */
      animation: scrollRightToLeft 25s linear infinite;
    }

    /* PAUSE ON HOVER */
    .marquee-track:hover {
      animation-play-state: paused;
    }

    @keyframes scrollRightToLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); } 
    }

    /* ----------------------------------
       GLASS MIRROR CARDS
    ----------------------------------- */
    .tool-card {
      width: var(--card-width);
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden; /* For the mirror sweep */
      transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
    }

    /* Mirror Light Sweep Effect */
    .tool-card::before {
      content: "";
      position: absolute;
      top: 0; 
      left: -150%;
      width: 50%; 
      height: 100%;
      background: linear-gradient(
        to right, 
        transparent, 
        rgba(255, 255, 255, 0.15), 
        transparent
      );
      transform: skewX(-25deg);
      transition: all 0.6s ease;
      z-index: 1;
      pointer-events: none;
    }

    .tool-card:hover::before {
      left: 150%;
    }

    .tool-card:hover {
      transform: translateY(-8px);
      border-color: var(--glass-hover);
      box-shadow: 0 15px 35px -5px rgba(255, 31, 61, 0.25), inset 0 0 20px rgba(255, 31, 61, 0.05);
      background: rgba(30, 5, 10, 0.6);
    }

    .tool-card > * {
      position: relative;
      z-index: 2;
    }

    .tool-icon-wrapper {
      width: 50px;
      height: 50px;
      background: rgba(255, 31, 61, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 1.8rem;
      transition: all 0.4s ease;
    }

    .tool-card:hover .tool-icon-wrapper {
      background: var(--accent);
      color: #fff;
      transform: scale(1.1) rotate(-5deg);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .tool-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 0.8rem;
    }

    .tool-description {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      min-height: 4.8rem;
    }

    .tool-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.2rem;
      border-top: 1px solid var(--glass-border);
    }

    .tool-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      transition: color 0.3s ease;
    }

    .tool-card:hover .tool-url {
      color: #fff;
    }

    .tool-arrow {
      color: var(--muted);
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }

    .tool-card:hover .tool-arrow {
      color: var(--accent);
      transform: translateX(10px);
    }

    /* ----------------------------------
       FOOTER
    ----------------------------------- */
    footer {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
      border-top: 1px solid var(--glass-border);
      background: rgba(5, 1, 2, 0.8);
    }
    
    .footer-right { font-family: 'JetBrains Mono', monospace; }

    @media (max-width: 768px) {
      .slider-section::before, .slider-section::after { width: 5vw; }
      .tool-card { width: 300px; padding: 1.5rem; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- Anime Vibe: Rising Embers/Sparks Canvas -->
  <canvas id="animeCanvas"></canvas>
  <div class="center-aura"></div>

  <header>
    <div class="nav-container">
      <a href="https://redrecon.cfd" class="brand">RED<span>RECON</span></a>
      <div class="nav-domain">redrecon.cfd</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="status-badge">
        <span class="status-dot"></span>
        Self-Hosted Security Tools
      </div>
      <h1>
        <span class="recon-text">Recon.</span>
        <span class="research-text">Research.</span><br>
        <span class="build-text">Build.</span>
      </h1>
      <p>
        An exclusive collection of self-hosted tools crafted for advanced security research, reconnaissance, and authorized red team testing.
      </p>
    </section>

    <!-- Infinite Scrolling Marquee Section -->
    <section class="slider-section">
      <div class="marquee-track" id="marqueeTrack">
        <!-- Cards injected via JS -->
      </div>
    </section>
  </main>

  <footer>
    <div>&copy; 2026 RedRecon. All rights reserved.</div>
    <div class="footer-right">Engineered for Security Research</div>
  </footer>

  <script>
    // ==========================================
    // 1. TOOL CONFIGURATION
    // একদম আপনার অনুমতি ছাড়া বাইরের কোনো টুল নেই। 
    // শুধু আপনার দেয়া ৩টি টুলই এখানে আছে।
    // ==========================================
    const tools = [
      {
        name: "GTFOBins",
        url: "https://gtfobins.redrecon.cfd",
        description: "Self-hosted Unix binary reference for security research and privilege escalation.",
        icon: "fa-solid fa-terminal"
      },
      {
        name: "RevShell",
        url: "https://revshells.redrecon.cfd",
        description: "Advanced self-hosted reverse shell generator and authorized lab utility.",
        icon: "fa-solid fa-network-wired"
      },
      {
        name: "Autofill Danger",
        url: "https://autofilldanger.redrecon.cfd",
        description: "Self-hosted assessment utilities for analyzing browser autofill vectors.",
        icon: "fa-solid fa-shield-halved"
      }
    ];

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function extractHostname(urlString) {
      try {
        const parsed = new URL(urlString);
        return parsed.hostname;
      } catch (e) {
        return urlString.replace(/^https?:\/\//, "").replace(/\/$/, "");
      }
    }

    // HTML Generator for a single card
    function createCardHTML(tool) {
      const safeName = escapeHTML(tool.name);
      const safeUrl = escapeHTML(tool.url);
      const safeDesc = escapeHTML(tool.description);
      const safeIcon = escapeHTML(tool.icon);
      const displayUrl = escapeHTML(extractHostname(tool.url));

      return `
        <a href="${safeUrl}" class="tool-card" target="_blank" rel="noopener noreferrer">
          <div>
            <div class="tool-icon-wrapper">
              <i class="${safeIcon}"></i>
            </div>
            <h3 class="tool-title">${safeName}</h3>
            <p class="tool-description">${safeDesc}</p>
          </div>
          <div class="tool-footer">
            <span class="tool-url">${displayUrl}</span>
            <span class="tool-arrow"><i class="fa-solid fa-arrow-right-long"></i></span>
          </div>
        </a>
      `;
    }

    // Render Marquee Cards
    function renderSlider() {
      const track = document.getElementById("marqueeTrack");
      if (tools.length === 0) return;

      const singleSetHTML = tools.map(tool => createCardHTML(tool)).join("");
      
      // যেহেতু টুল মাত্র ৩টি, ইনফিনিট লুপ স্মুথ করতে এটিকে বেশ কয়েকবার ডুপ্লিকেট করতে হবে
      // যাতে স্ক্রিনের ডানদিকে কখনো ফাঁকা জায়গা না আসে।
      track.innerHTML = singleSetHTML.repeat(6);
    }

    // ==========================================
    // 2. ANIME VIBE CANVAS ANIMATION (Embers/Sparks)
    // ==========================================
    function initAnimeBackground() {
      const canvas = document.getElementById("animeCanvas");
      const ctx = canvas.getContext("2d");
      
      let width, height;
      let particles = [];

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resize);
      resize();

      // Particle System for Embers
      class Ember {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = height + Math.random() * 300; // Start below screen
          this.size = Math.random() * 2.5 + 0.5; // Spark size
          this.speedY = -(Math.random() * 1.5 + 0.5); // Move up
          this.speedX = (Math.random() - 0.5) * 1; // Drift left/right
          this.opacity = Math.random() * 0.5 + 0.2;
          this.life = Math.random() * 0.02 + 0.005; // Fade out speed
        }
        update() {
          this.y += this.speedY;
          this.x += this.speedX;
          
          // Flicker effect
          if (Math.random() > 0.95) {
            this.speedX += (Math.random() - 0.5) * 0.5;
          }

          if (this.y < -10 || this.opacity <= 0) {
            this.reset();
            this.y = height + 10;
          }
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 31, 61, ${this.opacity})`;
          ctx.shadowBlur = 10;
          ctx.shadowColor = "#ff1f3d";
          ctx.fill();
          
          // Reset shadow for performance
          ctx.shadowBlur = 0; 
        }
      }

      // Create initial embers
      for (let i = 0; i < 70; i++) {
        particles.push(new Ember());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();
    }

    // Initialize everything on load
    document.addEventListener("DOMContentLoaded", () => {
      renderSlider();
      initAnimeBackground();
    });
  </script>
</body>
</html>
